name: Build Release Zip

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build, e.g. v1.0.0'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build Zip
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check versions match the tag
        run: |
          version="${TAG#v}"
          grep -qE "^ \* Version:\s+${version}$" classicflare.php || { echo "classicflare.php Version is not ${version}"; exit 1; }
          grep -qE "^Stable tag: ${version}$" readme.txt || { echo "readme.txt Stable tag is not ${version}"; exit 1; }
          grep -qE "^const VERSION = '${version}';" classicflare.php || { echo "VERSION constant is not ${version}"; exit 1; }

      - name: Install production autoloader
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Build zip
        run: |
          mkdir -p build/classicflare
          rsync -a --exclude-from=.distignore --exclude=build ./ build/classicflare/
          cd build
          zip -qr "classicflare-${TAG}.zip" classicflare
          unzip -l "classicflare-${TAG}.zip" | tail -n 1

      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${TAG}" >/dev/null 2>&1 || gh release create "${TAG}" --title "${TAG}" --notes "ClassicFlare ${TAG#v}"
          gh release upload "${TAG}" "build/classicflare-${TAG}.zip" --clobber
